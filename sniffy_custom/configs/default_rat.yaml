experiment:
  name: "Sniffy Pro - Bar Press VR-25"
  seed: 42
  ticks_per_second: 10
  max_session_ticks: 36000
  include_builtin_behaviors: true

organism:
  deprivation_initial: 0.8
  food_sound_association: 0.0
  behavioural_contrast_factor: 1.0

schedule:
  type: "vr"
  parameter: 25
  target_behavior: "Bar Press"

output:
  csv_path: "data/session.csv"
  plots_path: "data/plots/"
